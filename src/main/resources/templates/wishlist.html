<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Mine ønsker - Dreamy</title>
    <link rel="stylesheet"
          th:href="@{/style.css}"
          href="/style.css">


</head>
<body>
<header class="header">
    <h1>🌸Dreamy</h1>
    <nav>
        <a th:href="@{/}">Forside</a>
        <a th:href="@{/wishlists/new}">
            Opret ønskeseddel
        </a>
    </nav>
</header>
<main class="container">
    <h2 th:text="${wishlist.name}">
        Min ønskeseddel
    </h2>

    <div class="form-card">

        <h3>Tilføj et ønske  🎀</h3>
        <form th:action="@{/wishlists/{id}/wishes(id=${wishlist.id})}"
              method="post">
            <label for="name">
                Ønskets navn

            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Fx Nike sko"
                maxlength="100"
                required>
            <label for="price">
                Pris (kr.)
            </label>
            <input
                type="number"
                id="price"
                name="price"
                min="0"
                step="0.01"
                placeholder="Fx 599">

            <label for="link">
                Link til produkt 
            </label>

            <input
                type="url"
                id="link"
                name="link"
                placeholder="http://...">
            <button type="submit">
                + Tilføj ønske
            </button>
        </form>
    </div>
    <h2>Mine ønsker</h2>
    <p th:if="${#lists.isEmpty(wishes)}">
        Du har ikke tilføjet nogen ønsker endnu.
    </p>
    <div class="card-container">
            <div class="card"
                 th:each="wish : ${wishes}">
        <h3 th:text="${wish.name}">
            Ønskets navn
        </h3>
        <p th:if="${wish.price != null}">
            Pris:
            <span th:text="${wish.price}">0</span> kr.

        </p>

        <a th:if="${wish.link != null and !wish.link.isEmpty()}"
           th:href="${wish.link}"
           target="_blank"
           rel="noopener noreferrer">
           Se produkt
        </a>
        
    </div>
</div>

</main>
</body>
</html>
